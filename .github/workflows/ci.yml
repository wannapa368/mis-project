name: CI

on:
  push:
  pull_request:

jobs:
  conflict-markers:
    name: No leftover merge conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search for <<<<<<< / >>>>>>> markers
        run: |
          if git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!*.md'; then
            echo "::error::พบเครื่องหมาย conflict ค้างอยู่ในไฟล์ด้านบน"
            exit 1
          fi

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend install & start
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - name: Server starts and answers /api/test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci_test
          PORT: 5000
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5000/api/test; then exit 0; fi
            sleep 1
          done
          echo "::error::backend ไม่ตอบ /api/test"; cat server.log; exit 1
